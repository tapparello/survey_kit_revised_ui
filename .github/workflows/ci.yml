name: ci

# The replaced workflow used a bare `on: push:`, which ran on every branch.
# This runs on the long-lived branches plus every PR, so feature branches are
# covered once a PR exists - which Task 6 Step 7 creates before waiting on CI.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - run: flutter pub get

      # Hand-written Dart only. Generated .g.dart files are owned by their
      # generator, not the format gate - see ADO #1001.
      - name: Verify formatting
        run: |
          git ls-files -z '*.dart' \
            | grep -zv '\.g\.dart$' \
            | xargs -0 --no-run-if-empty \
                dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze --fatal-infos

      # example/ has its own pubspec, so the root analyze above never reaches
      # it. It reads SurveyStateProvider.of(context).surveyStateStream, which
      # this package's refactors are expected to preserve — this is the gate
      # behind that expectation. (ADO #1041)
      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - run: flutter pub get

      # Regeneration must be a no-op. Uses `git status --porcelain` rather than
      # `git diff --exit-code` so generated files that are ADDED or DELETED are
      # caught, not just modified - build_runner has been observed deleting all
      # 31 of them. Two `defaultValue` warnings are expected and do not fail the
      # build. See ADO #1001.
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build
          if [ -n "$(git status --porcelain -- '*.g.dart')" ]; then
            echo "::error::Generated code is stale. Run: dart run build_runner build"
            git status --porcelain -- '*.g.dart'
            git diff -- '*.g.dart'
            exit 1
          fi
