name: survey_kit
description: Create beautiful surveys with Flutter (inspired by iOS ResearchKit Surveys)
version: 1.0.0-dev.12
homepage: https://quickbirdstudios.com
repository: https://github.com/quickbirdstudios/survey_kit
issue_tracker: https://github.com/quickbirdstudios/survey_kit/issues

flutter:
  plugin:
    platforms:
      android:
        package: com.quickbirdstudios.survey_kit
        pluginClass: SurveyKitPlugin
      ios:
        pluginClass: SurveyKitPlugin

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.38.0"

dependencies:

  chewie: ^1.13.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  
  flutter:
    sdk: flutter
  
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  flutter_markdown: ^0.7.7+1
  image_picker: ^1.2.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  just_audio: ^0.10.5
  logger: ^2.7.0
  lottie: ^3.3.3
  rxdart: ^0.28.0
  syncfusion_flutter_sliders: ^33.1.45
  universal_html: ^2.3.0
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  video_player: ^2.11.1
  video_player_web_hls: ^1.3.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.0


